
services:
  web:
    image: ${IMAGE:?IMAGE must identify the image to deploy}
    container_name: ipsis-backend
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
      - ./.secrets:/app/.secrets

    networks:
      - ipsis_network

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=3).close()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    image: ${FRONT_IMAGE:?FRONT_IMAGE must identify the frontend image}
    container_name: ipsis-frontend
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:80"

    networks:
      - ipsis_network

networks:
  ipsis_network:
    external: true
    name: ipsis_network
